name: Sync Wiki to GitHub Wiki

on:
  push:
    branches: [ main, master ]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync Wiki Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push Wiki pages to GitHub Wiki
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          WIKI_REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"

          mkdir -p /tmp/wiki_temp
          cd /tmp/wiki_temp

          if git clone "$WIKI_REPO" .; then
            echo "Wiki repository cloned successfully."
          else
            echo "Creating initial wiki..."
            git init
            git remote add origin "$WIKI_REPO"
          fi

          cp -r ${{ github.workspace }}/wiki/* .

          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "Automated update of GitHub Wiki documentation"
            git push origin HEAD:master || git push origin HEAD:main || true
          else
            echo "No changes detected in Wiki."
          fi
